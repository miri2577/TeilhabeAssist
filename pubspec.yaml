name: teilhabe_assist
description: "KI-gestützte Berichterstellung für Eingliederungshilfe Berlin"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Lokale Speicherung (verschlüsselt)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # OS-Keystore (DPAPI / Keychain / Keystore) für Box-Encryption-Key
  flutter_secure_storage: ^9.2.2

  # Kryptographie
  pointycastle: ^3.9.1
  encrypt: ^5.0.3

  # HTTP Client
  dio: ^5.7.0

  # PDF
  pdf: ^3.11.2
  printing: ^5.13.4
  syncfusion_flutter_pdf: ^28.1.33

  # File Picker + Drag & Drop
  file_picker: ^8.1.7
  desktop_drop: ^0.5.0
  signature: ^5.5.0
  cross_file: ^0.3.5+2

  # Markdown
  flutter_markdown: ^0.7.6

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/templates/informationsbericht_101.pdf
    - assets/templates/mdb-ges_100_11_v12sp.pdf
    - assets/templates/land_berlin_logo.jpg
